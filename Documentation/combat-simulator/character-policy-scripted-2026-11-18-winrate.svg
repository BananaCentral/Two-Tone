<text x="790" y="48" fill="#aeb9ce" font-size="11" text-anchor="middle" font-family="system-ui,sans-serif">100%</text>
<text x="28" y="72" fill="#e8edf7" font-size="12" font-family="system-ui,sans-serif">character-overall:dawn · dawn</text>
<line x1="386.8388888888889" y1="68" x2="379.48888888888894" y2="68" stroke="#ff8b8b" stroke-width="3"/>
<circle cx="386.8388888888889" cy="68" r="5" fill="#f3bd66" stroke="#101728" stroke-width="1"/>
